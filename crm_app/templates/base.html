{#
  base.html: the shared layout every page uses (header, fonts, table styling).
  Other templates "extend" this one and fill in the "content" block below.
#}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dealer CRM{% endblock %}</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", sans-serif; margin: 0; color: #1f2933; background: #f5f7fa; }
    header { background: #1f2933; color: #fff; padding: 14px 24px; display: flex; gap: 24px; align-items: baseline; }
    header a { color: #cbd2d9; text-decoration: none; }
    header a:hover { color: #fff; }
    header .brand { color: #fff; font-weight: 600; font-size: 18px; margin-right: 8px; }
    .search { display: flex; gap: 8px; margin: 0 0 16px; }
    .search input { flex: 1; font-size: 16px; padding: 8px 10px; border: 1px solid #cbd2d9; border-radius: 4px; }
    .search button { font-size: 16px; padding: 8px 16px; border: 0; border-radius: 4px; background: #1f2933; color: #fff; cursor: pointer; }
    .num { text-align: right; }
    h2 { font-size: 17px; margin: 28px 0 8px; }
    main a { color: #2563a8; }
    .stats { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 8px; }
    .stats div { background: #fff; border: 1px solid #e4e7eb; border-radius: 6px; padding: 10px 16px; min-width: 110px; color: #616e7c; font-size: 13px; }
    .stats span { display: block; font-size: 22px; font-weight: 600; color: #1f2933; }
    .tag { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 10px; }
    .tag-purchase { background: #e3f8e9; color: #1b6b35; }
    .tag-service { background: #e6f0fb; color: #1f4f85; }
    .subtle-cell { color: #7b8794; font-size: 13px; white-space: nowrap; }
    td.nowrap, td.num, .tag { white-space: nowrap; }
    .table-scroll { overflow-x: auto; }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .subtle { color: #616e7c; margin: 0 0 16px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e4e7eb; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #e4e7eb; }
    th { background: #f0f4f8; font-size: 13px; text-transform: uppercase; letter-spacing: .03em; color: #52606d; }
    .error { background: #fff; border-left: 4px solid #d64545; padding: 12px 16px; }
    code { background: #f0f4f8; padding: 1px 4px; border-radius: 3px; }
  </style>
</head>
<body>
  <header>
    <a href="/" class="brand">Dealer CRM</a>
    <a href="/">Rooftops</a>
    <a href="/search">Search</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
